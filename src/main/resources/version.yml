# ==================================================
# PingFlow - Minecraft Protocol Versions
# ==================================================
# This file maps Minecraft protocol numbers to their
# corresponding Minecraft client versions.
#
# Available placeholder:
#   %version%
#
# Example:
#   Protocol 772 -> 1.21.6 / 1.21.7 / 1.21.8
#
# If a protocol is missing, the plugin will display:
#   Unknown version (protocol)
#
# To find the protocol number of a Minecraft version,
# you can check:
# https://minecraft.wiki/w/Protocol_version
#
# You can safely add new versions as they are released.
# ==================================================

